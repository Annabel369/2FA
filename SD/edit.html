<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="edit.title">Editar Arquivo - ESP32</title>
    <script src="/i18n.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h3 { color: #00ff66; word-break: break-all; }
        textarea { width: 100%; height: 450px; background: #1a1a1a; color: #00ff66; border: 1px solid #333; padding: 12px; font-family: monospace; font-size: 14px; border-radius: 4px; resize: vertical; }
        .btn-bar { margin-top: 15px; display: flex; gap: 10px; }
        button, a { padding: 10px 20px; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-save { background: #00ff66; color: #000; }
        .btn-save:hover { background: #00cc52; }
        .btn-cancel { background: #444; color: #fff; }
        .btn-cancel:hover { background: #666; }
        #msg { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 id="file-title" data-i18n="edit.editing">Editando: ...</h3>
    </div>

    <textarea id="editor" placeholder="Carregando conteúdo do arquivo..." data-i18n-attr="placeholder:edit.place"></textarea>

    <div class="btn-bar">
        <button class="btn-save" onclick="salvarArquivo()" data-i18n="edit.save">💾 Salvar Alterações</button>
        <a href="/list.html" class="btn-cancel" data-i18n="edit.cancel">⬅️ Voltar / Cancelar</a>
    </div>

    <div id="msg"></div>
</div>

<script>
var _tr = function(k){ return k; };
var _filePathFallback = 'Nenhum arquivo';

window.applyCustomI18N = function(tr, lang) {
    _tr = tr;
    _filePathFallback = (lang === 'en') ? 'No file' : 'Nenhum arquivo';
    var fp = urlParams.get('file');
    document.getElementById('file-title').innerText = _tr('edit.editing') + (fp || _filePathFallback);
    document.getElementById('editor').setAttribute('placeholder', _tr('edit.place'));
};

const urlParams = new URLSearchParams(window.location.search);
const filePath = urlParams.get('file');

document.getElementById('file-title').innerText = 'Editando: ' + (filePath || 'Nenhum arquivo');

async function carregarConteudo() {
    if (!filePath) {
        document.getElementById('editor').value = _tr('edit.errcustom');
        return;
    }

    try {
        const resp = await fetch(filePath);
        if (!resp.ok) throw new Error(_tr('edit.loaderr') + filePath);
        const text = await resp.text();
        document.getElementById('editor').value = text;
    } catch (err) {
        document.getElementById('msg').style.color = '#ff4444';
        document.getElementById('msg').innerText = _tr('edit.errload') + err.message;
    }
}

async function salvarArquivo() {
    const conteudo = document.getElementById('editor').value;
    const msgDiv = document.getElementById('msg');
    msgDiv.style.color = '#ffcc00';
    msgDiv.innerText = _tr('edit.saving');

    try {
        const formData = new FormData();
        formData.append('file', filePath);
        formData.append('data', conteudo);

        const resp = await fetch('/saveXARQ', {
            method: 'POST',
            body: formData
        });

        if (resp.ok) {
            msgDiv.style.color = '#00ff66';
            msgDiv.innerText = _tr('edit.saved');
        } else {
            throw new Error(_tr('edit.savefail'));
        }
    } catch (err) {
        msgDiv.style.color = '#ff4444';
        msgDiv.innerText = _tr('edit.saverr') + err.message;
    }
}

window.onload = carregarConteudo;
</script>

</body>
</html>
